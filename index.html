let i=0;


function updateMemory(){

document.getElementById("title").innerHTML=memories[i].title;

document.getElementById("text").innerHTML=memories[i].text;

document.getElementById("photo").src=memories[i].img;

document.getElementById("counter").innerHTML=
(i+1)+" / "+memories.length;


let photo=document.getElementById("photo");

photo.classList.remove("fade");

void photo.offsetWidth;

photo.classList.add("fade");

}


function next(){

const music=document.getElementById("bgm");

if(music.paused){

music.play().catch(()=>{});

}


i++;


if(i>=memories.length){

document.querySelector(".card").style.display="none";

document.getElementById("memoryWall").style.display="block";

return;

}


updateMemory();

}



function prev(){

if(i==0)return;

i--;

updateMemory();

}



for(let x=0;x<220;x++){

let s=document.createElement("div");

s.className="star";


let size=Math.random()*3+1;


s.style.width=size+"px";

s.style.height=size+"px";


s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";


s.style.opacity=Math.random();


s.style.animationDelay=Math.random()*5+"s";


document.querySelector(".stars").appendChild(s);

}



setInterval(()=>{

spark.style.bottom="-20px";

spark.style.fontSize="18px";

spark.style.pointerEvents="none";

document.body.appendChild(spark);



setTimeout(()=>{

},50);



setTimeout(()=>spark.remove(),8000);


},2500);
