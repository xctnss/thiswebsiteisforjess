<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>for jejes</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:linear-gradient(180deg,#1d2333,#0d1320);
font-family:Poppins;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;

}

.stars{

position:fixed;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;

}

.star{

position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;

}

@keyframes twinkle{

50%{

opacity:.2;
transform:scale(2);

}

}

.card{

width:750px;
height:520px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(12px);

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,.4);

padding:35px;

text-align:center;

animation:fadeIn 2s;

}

h1{

font-family:Caveat;
font-size:55px;
margin-bottom:20px;

}

p{

line-height:1.8;

font-size:18px;

margin-bottom:20px;

}

img{

width:420px;
height:280px;

object-fit:cover;

border-radius:18px;

box-shadow:0 10px 30px rgba(0,0,0,.3);

transition:.5s;

}

img:hover{

transform:scale(1.03) rotate(-2deg);

}

button{

margin-top:25px;

padding:15px 40px;

border:none;

border-radius:50px;

font-size:17px;

cursor:pointer;

background:#ffd8e5;

color:#333;

transition:.3s;

}

button:hover{

transform:scale(1.05);

}

.fade{

animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@keyframes fadeIn{

from{

opacity:0;

}

to{

opacity:1;

}

}

</style>

</head>

<body>

<div class="stars"></div>

<div class="card">

<h1 id="title">hi jejes</h1>

<p id="text">

ik its not much tapi atleast i bikin sesuatu lah yeah buat kau (karna aku blom)<br><br>

ini smua poto-poto buat kenang-kenangan (tentunya bukan i yang foto, i minta eje, thanks eje)

</p>

<img id="photo" src="photo 1.jpg">

<br>

<button onclick="next()">Next →</button>

</div>

<script>

for(let i=0;i<150;i++){

let s=document.createElement("div");
s.className="star";

s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";

s.style.animationDelay=Math.random()*5+"s";

document.querySelector(".stars").appendChild(s);

}

const memories=[

{

title:"foto 1",

text:"I'll always remember this day. Thank you for making ordinary moments feel special.",

img:"photo 1.jpg"

},

{

title:"Laughing Together",

text:"Every laugh with you became one of my favorite memories.",

img:"photo2.jpg"

},

{

title:"A Beautiful Day",

text:"Some memories fade... but these never will.",

img:"photo3.jpg"

},

{

title:"Thank You ❤️",

text:"No matter where life takes us, thank you for being part of my story.",

img:"photo4.jpg"

}

];

let i=0;

function next(){

i++;

if(i>=memories.length)i=0;

title.innerHTML=memories[i].title;

text.innerHTML=memories[i].text;

photo.src=memories[i].img;

photo.classList.remove("fade");

void photo.offsetWidth;

photo.classList.add("fade");

}

</script>

</body>
</html>
